plugins {
	id 'inventorywizard-loader'
	id 'net.fabricmc.fabric-loom'
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content { includeGroup 'com.terraformersmc' }
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release/'
		content { includeGroup 'org.quiltmc' }
	}
}

// Run the dev client on Quilt Loader instead of Fabric Loader: -Ploader=quilt
def useQuilt = providers.gradleProperty('loader').getOrElse('fabric') == 'quilt'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (useQuilt) {
		implementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
		// Loom only reads fabric-installer.json, so add the libraries from quilt-loader's quilt_installer.json by hand
		[
			'org.quiltmc:quilt-json5:1.0.4+final',
			'org.quiltmc:quilt-config:1.3.3',
			'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7',
			'org.ow2.asm:asm:9.10.1',
			'org.ow2.asm:asm-analysis:9.10.1',
			'org.ow2.asm:asm-commons:9.10.1',
			'org.ow2.asm:asm-tree:9.10.1',
			'org.ow2.asm:asm-util:9.10.1',
			'io.github.llamalad7:mixinextras-fabric:0.5.5',
		].each { implementation it }
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	}
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Settings screen is exposed through the Mod Menu API, which Mod Settings reads
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "maven.modrinth:mod-settings:${project.mod_settings_version}"
}

// Keep using the existing run/ folder at the repo root
loom.runs.configureEach {
	runDir = '../run'
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "inventorywizard-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

if (useQuilt) {
	// Loom only sets the fabric.* dev properties; Quilt reads loader.* instead, and without them it
	// loads no mods from the dev classpath. Each group is one mod's classes + resources folders.
	def classPathGroups = [sourceSets.main, sourceSets.gametest].collect { sourceSet ->
		(sourceSet.output.classesDirs.files + sourceSet.output.resourcesDir).join(File.pathSeparator)
	}.join(File.pathSeparator * 2)

	loom.runs.configureEach {
		mainClass = it.environment == 'server'
				? 'org.quiltmc.loader.impl.launch.knot.KnotServer'
				: 'org.quiltmc.loader.impl.launch.knot.KnotClient'
		property 'loader.development', 'true'
		property 'loader.classPathGroups', classPathGroups
	}
}

// Optional slow-motion for watching the client gametests: -PtestPace=<ticks per step>
tasks.named('runClientGameTest') {
	def pace = providers.gradleProperty('testPace')
	if (pace.isPresent()) {
		systemProperty 'inventorywizard.test.pace', pace.get()
	}
}
