modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/VanishingTacos/InventoryWizard/issues"

[[mods]]
modId = "inventorywizard"
version = "${version}"
displayName = "InventoryWizard"
displayURL = "https://github.com/VanishingTacos/InventoryWizard"
iconFile = "assets/inventorywizard/icon.png"
authors = "VanishingTacos"
description = '''Magically sort chests, shulker boxes, barrels, ender chests, your inventory and hotbar with cycling sorting modes. Works in singleplayer, as the LAN host, and on servers with the InventoryWizard plugin.'''

[[mixins]]
config = "inventorywizard.mixins.json"

[[dependencies.inventorywizard]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.inventorywizard]]
modId = "minecraft"
type = "required"
versionRange = "${mods_toml_minecraft_range}"
ordering = "NONE"
side = "CLIENT"
