# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Mod Properties
version=2.3.3
group=com.inventorywizard
archives_base_name=InventoryWizard
mod_id=inventorywizard

# Stonecutter: Groovy build scripts are intentional
dev.kikugie.stonecutter.hard_mode=true

# Per-Minecraft-version values (Minecraft, Java, Fabric API, NeoForge, Forge, ...) live in props/<mc>.properties

# Provided by Fabric Loader, NeoForge and Forge at runtime
mixin_version=0.17.4+mixin.0.8.7

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
# Only used with -Ploader=quilt, see https://quiltmc.org/en/install/
quilt_loader_version=0.31.0-beta.4

# NeoForge Properties
moddev_version=2.0.148

# Forge Properties
forgegradle_version=7.0.40
# Dev runs load classes and resources as one mod, as in the Forge MDK
net.minecraftforge.gradle.merge-source-sets=true

# Paper Properties
# The plugin is built against the oldest supported API so one jar loads on every version
# check these on https://repo.papermc.io/#browse/browse:maven-public:io%2Fpapermc%2Fpaper%2Fpaper-api
paper_api_version=1.21.1-R0.1-SNAPSHOT
paper_api_level=1.21
# Server the Paper test tasks run on
paper_test_minecraft_version=26.3
h2_version=2.4.240
bstats_version=3.2.1
shadow_version=9.6.1
run_paper_version=3.1.0
