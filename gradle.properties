# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Mod Properties
version=2.0.2
group=com.inventorywizard
archives_base_name=InventoryWizard
mod_id=inventorywizard

# Common
minecraft_version=26.3
# Vanilla classes the common project compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
# Provided by Fabric Loader, NeoForge and Forge at runtime
mixin_version=0.17.4+mixin.0.8.7

# Fabric Properties
# check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
# Only used with -Ploader=quilt, see https://quiltmc.org/en/install/
quilt_loader_version=0.31.0-beta.4
fabric_api_version=0.163.0+26.3
modmenu_version=21.0.0
mod_settings_version=1.2.0+26.3

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.95
moddev_version=2.0.148

# Forge Properties
# check these on https://files.minecraftforge.net/net/minecraftforge/forge/index_26.3.html
forge_version=26.3-66.0.13
forgegradle_version=7.0.40
# Dev runs load classes and resources as one mod, as in the Forge MDK
net.minecraftforge.gradle.merge-source-sets=true
