# Builds the mod jars for every Minecraft version (one multi-loader jar each, plus a Fabric jar before 26.1),
# plus the Paper jar, on every push and PR.
# Pushes to main also (re)create a draft release named after `version` in gradle.properties,
# with release notes taken from that version's section of CHANGELOG.md.
# Running it by hand on main with the modrinth and/or hangar box ticked also uploads the jars there
# (see .github/scripts/publish.sh), using that release's notes as the changelog.
name: Build & Draft Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      modrinth:
        description: Upload every jar to Modrinth
        type: boolean
        default: false
      hangar:
        description: Upload the Paper jar to Hangar
        type: boolean
        default: false
      loaders:
        description: Loaders to upload, to re-run part of a failed upload (a jar for several loaders is sent if any of them is listed)
        type: string
        default: fabric neoforge forge paper

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Existing tags are V1.0.0 ... V2.0.2
  TAG_PREFIX: V

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "version=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      # Only the jars players install; see .github/scripts/collect-jars.sh
      - name: Collect jars
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/collect-jars.sh

      - uses: actions/upload-artifact@v4
        with:
          name: InventoryWizard-${{ steps.version.outputs.version }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: InventoryWizard-${{ needs.build.outputs.version }}
          path: dist

      - name: Check for an existing release
        id: existing
        run: |
          tag="$TAG_PREFIX$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::notice::$tag is already published; bump version in gradle.properties to draft a new release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = "true" ]; then
            # Replace the old draft so its jars and notes match this commit
            gh release delete "$tag" --yes
          fi

      - name: Write release notes
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.existing.outputs.tag }}
        run: |
          # The body of CHANGELOG.md's "## [<version>]" section, without leading or trailing blank lines
          changes=$(awk -v heading="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = index($0, heading) == 1; next }
            found' CHANGELOG.md | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$changes" ]; then
            # Still drafted so the jars can be tried, but the publish job refuses notes with this marker
            echo "::warning::CHANGELOG.md has no '## [$VERSION]' section; the draft release says so and won't publish to Modrinth or Hangar"
            changes="<!-- missing-changelog -->
          > **No changelog yet:** add a \`## [$VERSION]\` section to CHANGELOG.md, or edit these notes before publishing."
          fi

          {
            echo "$changes"
            echo
            echo '## Downloads'
            echo
            echo "Pick the jar for your Minecraft version and loader. From 26.1 one jar covers Fabric, Quilt, NeoForge and Forge;"
            echo "before that, NeoForge and Forge share a jar and Fabric/Quilt has its own. Fabric and Quilt also need"
            echo "[Fabric API](https://modrinth.com/mod/fabric-api). The Paper jar runs on Paper and Spigot 1.21 and newer:"
            echo "\`$(cd dist && ls InventoryWizard-paper-*.jar)\`."
            echo
            echo "| Minecraft | Jars |"
            echo "| --- | --- |"
            for f in $(ls props/*.properties | sort -V); do
              mc=$(basename "$f" .properties)
              range=$(grep -E '^mods_toml_minecraft_range=' "$f" | cut -d= -f2)
              jars=$(cd dist && ls -- *"+$mc.jar" | sed 's/.*/`&`/' | paste -sd ' ' | sed 's/` `/`<br>`/g')
              echo "| \`$range\` | $jars |"
            done
          } > notes.md
          cat notes.md

      - name: Create draft release
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.existing.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.jar \
            --draft \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md

  publish:
    needs: [build, release]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && (inputs.modrinth || inputs.hangar)
    runs-on: ubuntu-latest
    permissions:
      # Writing is needed to read a draft release's notes
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: InventoryWizard-${{ needs.build.outputs.version }}
          path: dist

      # The release job may have skipped an already published release, so read the notes back from GitHub
      - name: Read release notes
        run: |
          gh release view "$TAG_PREFIX$VERSION" --json body --jq .body > notes.md
          if grep -q 'missing-changelog' notes.md; then
            echo "::error::The $TAG_PREFIX$VERSION release has no changelog; add a '## [$VERSION]' section to CHANGELOG.md (or edit the release notes) first"
            exit 1
          fi

      - name: Upload to Modrinth and Hangar
        env:
          CHANGELOG_FILE: notes.md
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
          LOADERS: ${{ inputs.loaders }}
          PLATFORMS: >-
            ${{ inputs.modrinth && 'modrinth' || '' }}
            ${{ inputs.hangar && 'hangar' || '' }}
        run: |
          # Word splitting turns PLATFORMS into one argument per platform
          # shellcheck disable=SC2086
          bash .github/scripts/publish.sh $PLATFORMS
