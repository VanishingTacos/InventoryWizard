plugins {
	id 'inventorywizard-common'
	id 'net.neoforged.moddev'
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
		content { includeGroup 'net.fabricmc' }
	}
}

// Vanilla Minecraft only; anything loader-specific goes through com.inventorywizard.platform.Platform
neoForge {
	neoFormVersion = project.neo_form_version
}

dependencies {
	// Fabric Loader and NeoForge both ship Mixin
	// Only the annotations are needed; its ASM would clash with the version older Minecraft pins
	compileOnly("net.fabricmc:sponge-mixin:${project.mixin_version}") {
		transitive = false
	}
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

// Stonecutter writes the sources for this Minecraft version to build/generated/stonecutter
def versionedSources = { String path -> layout.buildDirectory.dir("generated/stonecutter/$path") }

artifacts {
	commonJava(versionedSources('main/java')) { builtBy tasks.named('stonecutterGenerate') }
	commonResources(versionedSources('main/resources')) { builtBy tasks.named('stonecutterGenerate') }
}

// NeoForge/Forge client gametests; compiled here against vanilla, run by each loader's runClientGameTest
sourceSets {
	gametest {
		compileClasspath += main.output + main.compileClasspath
	}
}

configurations {
	commonGametestJava {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonGametestJava(versionedSources('gametest/java')) { builtBy tasks.named('stonecutterGenerateGametest') }
}
