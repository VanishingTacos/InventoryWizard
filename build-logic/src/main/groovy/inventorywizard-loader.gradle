// Loader subprojects compile the common sources and resources into their own jar
plugins {
	id 'inventorywizard-common'
}

configurations {
	commonJava {
		canBeResolved = true
		canBeConsumed = false
	}
	commonResources {
		canBeResolved = true
		canBeConsumed = false
	}
}

// The common project for the same Minecraft version
def commonPath = ":common:${project.name}"

dependencies {
	commonJava(project(path: commonPath, configuration: 'commonJava'))
	commonResources(project(path: commonPath, configuration: 'commonResources'))
}

tasks.named('compileJava', JavaCompile) {
	dependsOn(configurations.commonJava)
	source(configurations.commonJava)
}

processResources {
	dependsOn(configurations.commonResources)
	from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
	dependsOn(configurations.commonJava, configurations.commonResources)
	from(configurations.commonJava)
	from(configurations.commonResources)
}
