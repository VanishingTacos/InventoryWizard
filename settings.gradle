pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Lets Gradle download the JDKs ModDevGradle and ForgeGradle tools ask for (e.g. Java 21 for downloadAssets)
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'InventoryWizard'
includeBuild('build-logic')
include('common', 'fabric', 'neoforge', 'forge')
